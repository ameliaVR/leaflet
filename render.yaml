services:
  - type: web
    name: leaflet-web
    runtime: node
    plan: free
    buildCommand: npm ci --prefix client && npm run build --prefix client && npm ci --prefix server
    startCommand: npm run db:init --prefix server && npm run start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
