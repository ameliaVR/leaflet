name: Verify Leaflet

on:
  pull_request:
  push:
    branches: [main, deploy/render-neon-cloudinary]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Frontend install and build
        run: npm ci --prefix client && npm run build --prefix client
      - name: Backend install and syntax check
        run: npm ci --prefix server && node --check server/src/index.js && node --check server/src/init.js
